  <path d="M250 300 L550 300 L550 320 L250 320Z" fill="#C7B593"/>
  <path d="M330 320 A70 52 0 0 1 470 320Z" fill="#DFDCCC"/>
  <path d="M330 320 A70 52 0 0 1 470 320" fill="none" stroke="#A48F71" stroke-width="6"/>
  <rect x="250" y="292" width="300" height="9" fill="#DCCBA8"/>
  <!-- ermita -->
  <g><path d="M596 236 h72 v64 h-72z" fill="#F4EEE0"/><path d="M590 236 l42-26 l42 26z" fill="#B0553A"/>
     <rect x="624" y="266" width="16" height="34" fill="#8A7355"/>
     <rect x="656" y="206" width="12" height="30" fill="#F4EEE0"/></g>
  <path d="M0 402 L800 386 L800 450 L0 450Z" fill="#2F5D3A"/>
