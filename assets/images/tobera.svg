<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Tobera: cascadas del río Molinar y ermita">
  <defs>
    <linearGradient id="tsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EEE9DC"/><stop offset="1" stop-color="#DFDCCC"/></linearGradient>
    <linearGradient id="twater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#BCD2DC"/><stop offset="1" stop-color="#6C8CA0"/></linearGradient>
    <linearGradient id="tcliff" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#B8A585"/><stop offset="1" stop-color="#9C876A"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#tsky)"/>
  <!-- paredes del desfiladero -->
  <path d="M0 0 L250 0 L262 140 L206 214 L228 300 L150 450 L0 450Z" fill="url(#tcliff)"/>
  <path d="M800 0 L560 0 L548 128 L604 206 L578 296 L660 450 L800 450Z" fill="url(#tcliff)"/>
  <path d="M0 0 L180 0 L196 132 L138 210 L96 450 L0 450Z" fill="#A6906F" opacity=".6"/>
