  <g fill="#47784F" opacity=".85">
    <ellipse cx="212" cy="196" rx="54" ry="30"/><ellipse cx="596" cy="188" rx="58" ry="32"/>
    <ellipse cx="150" cy="286" rx="46" ry="26"/><ellipse cx="654" cy="280" rx="50" ry="28"/>
  </g>
  <!-- cascada -->
  <path d="M330 150 C 322 240, 316 280, 306 330 L 494 330 C 486 276, 480 236, 472 150Z" fill="url(#twater)" opacity=".92"/>
  <g stroke="#FFFFFF" stroke-width="3" opacity=".55" fill="none">
    <path d="M358 168 C 352 240, 348 286, 342 326"/>
    <path d="M400 160 C 398 236, 396 288, 394 328"/>
    <path d="M442 168 C 448 240, 452 286, 458 326"/>
  </g>
  <!-- poza -->
  <ellipse cx="400" cy="360" rx="150" ry="40" fill="#7C9BAD"/>
  <ellipse cx="400" cy="356" rx="112" ry="26" fill="#A9C3D0" opacity=".7"/>
