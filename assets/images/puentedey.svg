  <g><path d="M552 216 h56 v60 h-56z" fill="#F4EEE0"/><path d="M546 216 l34-22 l34 22z" fill="#B0553A"/>
     <rect x="608" y="184" width="16" height="92" fill="#F4EEE0"/><path d="M604 184 l12-18 l12 18z" fill="#8C5A3C"/></g>
