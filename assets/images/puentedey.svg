  <path d="M180 418 q40 -8 80 0" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".45"/>
  <path d="M560 424 q44 -8 88 0" stroke="#FFFFFF" stroke-width="3" fill="none" opacity=".4"/>
  <!-- ribera -->
  <g fill="#3E6B41"><ellipse cx="52" cy="376" rx="52" ry="34"/><ellipse cx="754" cy="372" rx="56" ry="34"/></g>
