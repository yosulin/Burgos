<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Puentedey: puente natural sobre el río Nela">
  <defs>
    <linearGradient id="psky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#F1EADC"/><stop offset="1" stop-color="#E2DAC8"/></linearGradient>
    <linearGradient id="prock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBB99A"/><stop offset="1" stop-color="#9E8969"/></linearGradient>
    <linearGradient id="priver" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#A6C0CE"/><stop offset="1" stop-color="#6C8CA0"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#psky)"/>
