  <path d="M0 316 L96 286 L214 322 L330 282 L448 324 L586 288 L700 328 L824 292 L960 330 L960 400 L0 400Z" fill="url(#mid)"/>
  <!-- río Nela -->
  <path d="M-20 452 C 160 420, 250 470, 420 446 C 570 424, 690 462, 860 434 L 980 428 L 980 470 C 820 496, 700 462, 560 486 C 400 512, 250 476, 90 500 L-20 508Z" fill="#93AEBE" opacity=".85"/>
  <path d="M-20 452 C 160 420, 250 470, 420 446 C 570 424, 690 462, 860 434 L 980 428" fill="none" stroke="#6C8CA0" stroke-width="3" opacity=".5"/>
  <!-- laderas cercanas -->
  <path d="M0 396 L120 362 L240 400 L330 380 L360 540 L0 540Z" fill="url(#near)"/>
  <path d="M960 398 L850 364 L730 402 L640 382 L610 540 L960 540Z" fill="url(#near)"/>
