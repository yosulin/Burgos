    <path d="M232 372 h44 v30 h-44z"/><path d="M226 372 l28-20 l28 20z" fill="#B0553A"/>
    <path d="M292 380 h34 v22 h-34z"/><path d="M287 380 l22-15 l22 15z" fill="#B0553A"/>
    <path d="M690 388 h40 v26 h-40z"/><path d="M684 388 l26-18 l26 18z" fill="#B0553A"/>
