<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" preserveAspectRatio="xMidYMid slice" role="img" aria-label="Valle de Tobalina: cascada del Peñón sobre el río Jerea">
  <defs>
    <linearGradient id="vsky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#EFEADD"/><stop offset="1" stop-color="#DDDCCF"/></linearGradient>
    <linearGradient id="vwater" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#CBDDD4"/><stop offset="1" stop-color="#5E9384"/></linearGradient>
    <linearGradient id="vrock" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#C0AC8A"/><stop offset="1" stop-color="#93805F"/></linearGradient>
  </defs>
  <rect width="800" height="450" fill="url(#vsky)"/>
  <!-- sierras del valle al fondo -->
  <path d="M0 150 L120 96 L232 148 L330 108 L452 160 L560 118 L688 162 L800 128 L800 210 L0 210Z" fill="#8E9E86" opacity=".55"/>
  <path d="M0 186 L150 140 L280 184 L420 148 L560 190 L700 156 L800 186 L800 240 L0 240Z" fill="#6E8468" opacity=".7"/>
  <!-- cauce alto del Jerea -->
  <rect x="0" y="228" width="800" height="42" fill="#7FA79A"/>
  <rect x="0" y="228" width="800" height="14" fill="#A9C7BB" opacity=".7"/>
  <!-- plataforma rocosa: el salto ancho del Peñón -->
  <path d="M0 262 L800 262 L800 300 L0 300Z" fill="url(#vrock)"/>
  <path d="M0 296 L800 296 L800 312 L0 312Z" fill="#7E6C50" opacity=".75"/>
  <!-- lámina de agua cayendo a lo ancho -->
  <path d="M70 268 L730 268 L714 348 L86 348Z" fill="url(#vwater)" opacity=".95"/>
  <g stroke="#FFFFFF" stroke-width="3" opacity=".45" fill="none">
    <path d="M150 274 L142 344"/><path d="M250 274 L244 344"/><path d="M350 274 L346 344"/>
    <path d="M450 274 L454 344"/><path d="M550 274 L556 344"/><path d="M650 274 L658 344"/>
  </g>
  <!-- poza de agua esmeralda -->
  <ellipse cx="400" cy="372" rx="290" ry="52" fill="#4F8878"/>
  <ellipse cx="400" cy="366" rx="222" ry="34" fill="#77AD9C" opacity=".8"/>
  <ellipse cx="400" cy="360" rx="138" ry="18" fill="#A8CEC0" opacity=".65"/>
  <!-- espuma al pie del salto -->
  <g fill="#F2F6F1" opacity=".75">
    <ellipse cx="220" cy="348" rx="58" ry="13"/><ellipse cx="400" cy="352" rx="76" ry="15"/>
    <ellipse cx="586" cy="348" rx="60" ry="13"/>
  </g>
  <!-- ribera y arbolado -->
  <path d="M0 398 L800 384 L800 450 L0 450Z" fill="#33603F"/>
  <g fill="#3F7349">
    <ellipse cx="86" cy="384" rx="54" ry="34"/><ellipse cx="164" cy="394" rx="40" ry="26"/>
    <ellipse cx="716" cy="376" rx="58" ry="36"/><ellipse cx="636" cy="390" rx="42" ry="26"/>
  </g>
  <g fill="#6B5638">
    <rect x="82" y="404" width="9" height="28"/><rect x="712" y="398" width="9" height="30"/>
  </g>
</svg>
