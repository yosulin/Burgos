<!DOCTYPE html>
<html lang="es" class="scroll-smooth">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Ruta Merindades en Familia</title>
  <meta name="description" content="Guía offline del fin de semana familiar por Las Merindades (Burgos), 12-13 de septiembre de 2026." />
  <meta name="theme-color" content="#0f766e" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
  <meta name="apple-mobile-web-app-title" content="Merindades" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="assets/tailwind.css" />
  <link rel="stylesheet" href="styles.css" />
</head>
<body class="bg-slate-100 text-slate-800 antialiased min-h-screen">

  <!-- Cabecera + pestañas fijas -->
  <header class="fixed top-0 inset-x-0 z-40 bg-brand-700 text-white shadow-lg pt-[env(safe-area-inset-top)]">
    <div class="px-4 pt-3 pb-2 flex items-start justify-between gap-3">
      <div class="min-w-0">
        <h1 id="trip-title" class="text-lg font-bold leading-tight truncate">Las Merindades en Familia</h1>
        <p id="trip-dates" class="text-xs text-brand-100">12 - 13 Septiembre 2026</p>
      </div>
      <div class="flex items-center gap-2 shrink-0">
        <span id="net-badge" class="hidden text-[10px] font-semibold uppercase tracking-wide bg-amber-400 text-amber-950 rounded-full px-2 py-1">Offline</span>
        <button id="reset-btn" type="button" title="Reiniciar checklist"
          class="rounded-full bg-white/15 hover:bg-white/25 active:bg-white/30 p-2 transition">
          <svg viewBox="0 0 24 24" class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 12a9 9 0 1 0 3-6.7L3 8"/><path d="M3 3v5h5"/></svg>
        </button>
      </div>
    </div>

    <!-- Progreso -->
    <div class="px-4 pb-2">
      <div class="h-1.5 w-full rounded-full bg-white/20 overflow-hidden">
        <div id="progress-bar" class="h-full bg-lime-300 transition-all duration-500" style="width:0%"></div>
      </div>
      <p id="progress-text" class="mt-1 text-[11px] text-brand-100">0 de 0 hitos completados</p>
    </div>

    <!-- Pestañas -->
    <nav id="tabs" class="flex bg-brand-900/40" role="tablist" aria-label="Secciones del viaje"></nav>
  </header>

  <!-- Contenido -->
  <main id="content" class="px-4 pb-28"></main>

  <!-- Barra inferior de acción rápida -->
  <div class="fixed bottom-0 inset-x-0 z-30 p-3 pb-[calc(0.75rem+env(safe-area-inset-bottom))] bg-gradient-to-t from-slate-100 via-slate-100/95 to-transparent">
    <a id="base-nav" href="#" target="_blank" rel="noopener"
       class="flex items-center justify-center gap-2 w-full rounded-2xl bg-slate-900 text-white font-semibold py-3.5 shadow-xl active:scale-[0.99] transition">
      <svg viewBox="0 0 24 24" class="w-5 h-5" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M3 11l19-9-9 19-2-8-8-2z"/></svg>
      Volver al alojamiento
    </a>
  </div>

  <!-- Toast -->
  <div id="toast" class="fixed left-1/2 -translate-x-1/2 bottom-24 z-50 hidden rounded-full bg-slate-900 text-white text-sm px-4 py-2 shadow-xl"></div>

  <script src="data.js"></script>
  <script src="app.js"></script>
</body>
</html>
