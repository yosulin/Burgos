<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Las Merindades en Familia</title>
  <meta name="description" content="Guía del fin de semana familiar por Las Merindades (Burgos), 12-13 de septiembre de 2026. Funciona sin conexión." />
  <meta name="color-scheme" content="light" />
  <meta name="theme-color" content="#2F5D3A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="Merindades" />
  <link rel="manifest" href="manifest.json" />
  <link rel="icon" href="assets/icons/icon.svg" type="image/svg+xml" />
  <link rel="apple-touch-icon" href="assets/icons/icon-192.png" />
  <link rel="stylesheet" href="styles.css?v=13" />
</head>
<body>

  <span class="offline-chip" id="offline-chip" hidden>Sin conexión</span>

  <!-- Aviso de instalación: solo si la app no está ya instalada -->
  <aside class="install-bar" id="install-bar" hidden>
    <span class="install-bar__ico" aria-hidden="true">📲</span>
    <p class="install-bar__txt" id="install-bar-txt">Instala la guía y la tendrás sin cobertura.</p>
    <button class="install-bar__cta" id="install-bar-cta" type="button" hidden>Instalar</button>
    <button class="install-bar__x" id="install-bar-x" type="button" aria-label="Cerrar el aviso">✕</button>
  </aside>

  <!-- Portada -->
  <header class="hero">
    <div class="hero__media">
      <img id="hero-img" src="assets/images/hero.svg" alt="Ilustración del valle de Las Merindades" />
    </div>
    <div class="hero__body wrap">
      <p class="hero__dates" id="hero-dates">12 - 13 septiembre 2026</p>
      <h1 id="hero-title">Las Merindades en Familia</h1>
      <p class="hero__places" id="hero-places">Frías · Tobera · Puentedey · Ojo Guareña</p>

    </div>
  </header>

  <!-- Pestañas -->
  <div class="tabs-holder" id="tabs-holder">
    <div class="wrap">
      <div class="tabs" id="tabs" role="tablist" aria-label="Días del viaje"></div>
    </div>
  </div>

  <!-- Contenido -->
  <main id="content" class="wrap"></main>

  <p class="foot wrap" id="foot"></p>


  <div class="toast" id="toast" hidden></div>

  <script src="data.js?v=13"></script>
  <script src="app.js?v=13"></script>
</body>
</html>
